<article class="card border-0 shadow-sm h-100 rounded-4 overflow-hidden hover-shadow">
  <div class="product-image-container bg-light">
    <img [src]="producto.imageUrl || imagenRespaldo" (error)="onImageError($event)" class="product-image w-100 h-100 object-fit-cover" [alt]="producto.name">
  </div>
  <div class="card-body d-flex flex-column p-4">
    <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
      <h2 class="h5 fw-bold mb-0">{{ producto.name }}</h2>
      <span class="badge rounded-pill text-bg-warning">{{ producto.type }}</span>
    </div>
    <p class="small text-secondary flex-grow-1 mb-3">{{ producto.description }}</p>
    <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
      <span class="fw-bold fs-5 text-danger">{{ producto.price | currency:'COP':'symbol-narrow':'1.0-0' }}</span>
      <span class="badge rounded-pill" [class.text-bg-success]="disponible" [class.text-bg-secondary]="!disponible">{{ disponible ? 'Disponible' : 'Agotado' }}</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <input class="form-control text-center rounded-3" style="max-width: 80px;" type="number" min="1" step="1" [(ngModel)]="cantidad" aria-label="Cantidad">
      <button class="btn btn-danger rounded-pill px-4 flex-grow-1" type="button" [disabled]="!cantidadValida || !disponible" (click)="agregarAlCarrito()">{{ disponible ? 'Agregar' : 'No disponible' }}</button>
    </div>
  </div>
</article>
