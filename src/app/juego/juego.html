<!-- Modal de victoria -->
<div class="modal d-block" tabindex="-1" *ngIf="mostrarModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <!-- Modal Header -->
            <div class="modal-header">
                <h4 class="modal-title">¡Felicidades!</h4>
                <button type="button" class="btn-close"
                    (click)="cerrarModal()"></button>
            </div>

            <!-- Modal body -->
            <div class="modal-body">
                {{mensaje2}}
            </div>

            <!-- Modal footer -->
            <div class="modal-footer">
                <button type="button" class="btn btnCerrarModal"
                    (click)="cerrarModal()">Cerrar</button>
            </div>

        </div>
    </div>
</div>
<div class="modal-backdrop show" *ngIf="mostrarModal"></div>
