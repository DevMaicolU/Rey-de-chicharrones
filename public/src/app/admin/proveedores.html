<div class="container">
  <h1 class="h2 text-danger mb-4">Gestión de Proveedores</h1>
  <section class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <form class="input-group" (ngSubmit)="add()">
        <input class="form-control" name="provider" placeholder="Nombre - correo@ejemplo.com" aria-label="Proveedor" autocomplete="off" [(ngModel)]="provider">
        <button class="btn btn-warning" type="submit">Añadir proveedor</button>
      </form>
      @if (error) { <div class="alert alert-danger py-2 mt-3 mb-0" role="alert">{{ error }}</div> }
    </div>
  </section>
  <div class="list-group shadow-sm">
    @for (item of providers(); track item) {
      <div class="list-group-item d-flex justify-content-between align-items-center">
        <span>{{ item }}</span>
        <button class="btn btn-sm btn-outline-danger" type="button" (click)="remove(item)">Quitar</button>
      </div>
    } @empty {
      <div class="list-group-item text-center text-secondary py-4">No hay proveedores registrados.</div>
    }
  </div>
</div>
