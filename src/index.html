<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>RoyalSoft · Punto de venta</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="Images/Logo Manila.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('royalsoft-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || (!saved && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-bs-theme', theme);
          if (theme === 'dark') document.documentElement.classList.add('dark-theme');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-principal></app-principal>
  </body>
</html>
