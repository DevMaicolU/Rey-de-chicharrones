<div class="container py-2">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
    <div>
      <span class="badge text-bg-warning mb-2">MENÚ ACTIVO</span>
      <h1 class="h2 text-danger fw-bold mb-1">Comidas</h1>
      <p class="text-secondary mb-0">Selecciona productos para construir el pedido.</p>
    </div>
    <span class="small text-secondary">{{ comidas().length }} opciones disponibles</span>
  </div>
  <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
    @for (producto of comidas(); track producto.id) {
      <div class="col"><app-tarjeta-producto [producto]="producto" /></div>
    } @empty {
      <div class="col-12"><div class="alert alert-warning rounded-4 border-0 shadow-sm">No hay comidas creadas. El administrador puede crearlas desde Gestión de Inventario.</div></div>
    }
  </div>
</div>
