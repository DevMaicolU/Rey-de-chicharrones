<main class="min-vh-100 d-flex align-items-center bg-light position-relative">
  <div class="position-absolute top-0 end-0 p-3">
    <button
      type="button"
      class="btn btn-sm btn-outline-secondary rounded-pill px-3 py-1 d-inline-flex align-items-center gap-2 theme-toggle-btn shadow-sm"
      (click)="theme.toggleTheme()"
      [attr.aria-label]="theme.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
      [title]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    >
      <span class="lh-1">{{ theme.isDark() ? '☀️' : '🌙' }}</span>
      <span>{{ theme.isDark() ? 'Modo Claro' : 'Modo Oscuro' }}</span>
    </button>
  </div>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-9 col-md-6 col-lg-4">
        <section class="card shadow-sm border-0">
          <div class="card-body p-4 p-lg-5">
            <div class="text-center mb-4">
              <div class="display-6 fw-bold text-danger">ROYALSOFT</div>
              <p class="text-secondary mb-0">Punto de venta</p>
            </div>
            <form (ngSubmit)="ingresar()">
              <label class="form-label" for="username">Usuario</label>
              <input id="username" name="username" class="form-control mb-3" autocomplete="username" [(ngModel)]="username" required>
              <label class="form-label" for="password">Contraseña</label>
              <input id="password" name="password" type="password" class="form-control mb-3" autocomplete="current-password" [(ngModel)]="password" required>
              @if (error) { <div class="alert alert-danger py-2" role="alert">{{ error }}</div> }
              <button class="btn btn-danger w-100" type="submit">Ingresar</button>
            </form>
            <div class="small text-secondary mt-4">
              Admin: <strong>admin / admin123</strong><br>
              Empleado: <strong>empleado / empleado123</strong>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
