<div class="container">
  <h1 class="h2 text-danger mb-4">Gestión de Empleados</h1>
  <section class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <h2 class="h5">Crear usuario</h2>
      <form class="row g-2" (ngSubmit)="add()">
        <div class="col-md-3"><input class="form-control" name="username" placeholder="Usuario" aria-label="Usuario" autocomplete="off" [(ngModel)]="username"></div>
        <div class="col-md-3"><input class="form-control" name="name" placeholder="Nombre" aria-label="Nombre" autocomplete="off" [(ngModel)]="name"></div>
        <div class="col-md-2"><input class="form-control" name="password" type="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="new-password" [(ngModel)]="password"></div>
        <div class="col-md-2">
          <select class="form-select" name="role" aria-label="Rol" [(ngModel)]="role">
            <option value="empleado">Empleado</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="col-md-2"><button class="btn btn-warning w-100" type="submit">Crear</button></div>
      </form>
      @if (error) { <div class="alert alert-danger py-2 mt-3 mb-0" role="alert">{{ error }}</div> }
    </div>
  </section>
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-danger"><tr><th>Usuario</th><th>Nombre</th><th>Rol</th><th></th></tr></thead>
        <tbody>
          @for (user of users(); track user.id) {
            <tr>
              <td>{{ user.username }}</td>
              <td>{{ user.name }}</td>
              <td>{{ user.role === 'admin' ? 'Admin' : 'Empleado' }}</td>
              <td class="text-end">
                @if (esUsuarioActual(user)) {
                  <span class="text-secondary small">Tu cuenta</span>
                } @else {
                  <button class="btn btn-sm btn-outline-danger" type="button" (click)="remove(user)">Eliminar</button>
                }
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
