<nav class="navbar navbar-expand-sm navbar-dark bg-dark BarraNav">
  <div class="container-fluid">
    <a class="navbar-brand BarraInicio" routerLink="/" routerLinkActive="active"
      [routerLinkActiveOptions]="{exact: true}"><img src="/Images/manila.jpg"
        class="imagenNav"></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#mynavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse items" id="mynavbar">
      <ul class="navbar-nav ms-auto gap-5">
        <li class="nav-item itemNav">
          <a class="nav-link itemNav" routerLink="/" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}">Inicio</a>
        </li>
        <li class="nav-item itemNav">
          <a class="nav-link itemNav" routerLink="/comidas"
            routerLinkActive="active">Comidas</a>
        </li>
        <li class="nav-item itemNav">
          <a class="nav-link itemNav" routerLink="/bebidas"
            routerLinkActive="active">Bebidas</a>
        </li>
        <li class="nav-item itemNav ">
          <a class="nav-link itemNav" routerLink="/juego"
            routerLinkActive="active">Juego</a>
        </li>
        <li class="nav-item itemNav">
          <a class="nav-link itemNav" routerLink="/pedidos"
            routerLinkActive="active">
            Pedido
            @if (carrito.items().length > 0) {
            <span class="simbolo-carrito">{{ carrito.items().length }}</span>
            }
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<button type="button" class="btn botonVolver" [class.saltando]="saltando"
  (click)="irArriba($event)" (animationend)="onAnimationEnd()">
  Volver arriba
</button>
