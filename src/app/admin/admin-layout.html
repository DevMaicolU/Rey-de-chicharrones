<nav class="navbar navbar-expand-lg navbar-dark bg-danger manila-navbar-sticky">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" routerLink="/admin">
      <span>ROYALSOFT <small class="fw-normal opacity-75">ADMIN</small></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNav" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="adminNav" class="collapse navbar-collapse">
      <div class="navbar-nav me-auto gap-lg-2">
        <a class="nav-link" routerLink="inventario" routerLinkActive="active fw-bold">📦 Inventario</a>
        <a class="nav-link" routerLink="proveedores" routerLinkActive="active fw-bold">🏢 Proveedores</a>
        <a class="nav-link" routerLink="compras" routerLinkActive="active fw-bold">🛒 Compras</a>
        <a class="nav-link" routerLink="empleados" routerLinkActive="active fw-bold">👥 Usuarios</a>
        <a class="nav-link" routerLink="reportes" routerLinkActive="active fw-bold">📊 Reportes</a>
      </div>
      <!-- Botón de Modo Oscuro / Claro -->
      <button
        type="button"
        class="btn btn-outline-light btn-sm rounded-pill px-3 py-1 me-3 d-inline-flex align-items-center gap-2 theme-toggle-btn shadow-sm"
        (click)="theme.toggleTheme()"
        [attr.aria-label]="theme.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
        [title]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        <span class="lh-1">{{ theme.isDark() ? '☀️' : '🌙' }}</span>
        <span>{{ theme.isDark() ? 'Modo Claro' : 'Modo Oscuro' }}</span>
      </button>

      <span class="navbar-text text-white me-3 fw-semibold">👤 {{ auth.activeUser?.name }}</span>
      <button class="btn btn-outline-light btn-sm rounded-3" type="button" (click)="salir()">Cerrar Sesión</button>
    </div>
  </div>
</nav>
@if (database.persistenceError$ | async; as persistenceError) {
  @if (persistenceError) {
    <div class="alert alert-danger rounded-0 mb-0" role="alert">{{ persistenceError }}</div>
  }
}
<main class="container-fluid py-4 bg-light min-vh-100"><router-outlet /></main>
